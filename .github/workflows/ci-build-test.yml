name: 🚀 CI Build & Test

on:
  push:
    branches:
      - "feature/*"
      - "bug/*"
      - "hotfix/*"
      - "devin/*"
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "Eaf.Template.Bff.sln"
  TEST_PROJECT: "tests/Eaf.Template.Bff.Tests/Eaf.Template.Bff.Tests.csproj"

jobs:
  # Build and test the BFF solution on Ubuntu
  build-bff:
    name: Build & Test BFF (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --no-cache --force --verbosity minimal

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release --verbosity minimal

      - name: Check Code Formatting
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --verbosity minimal

      - name: Run Tests with Coverage
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage" \
            --verbosity normal \
            --framework net10.0

      - name: Generate Coverage Report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --ignore-failed-sources
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"Html;Cobertura;MarkdownSummary"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.coverage
          retention-days: 7

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            TestResults/**/coverage.cobertura.xml
            TestResults/CoverageReport/**
          retention-days: 7

  # Build and test on Windows to ensure cross-platform compatibility
  build-windows:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --no-cache --force --verbosity minimal

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release --verbosity minimal

      - name: Run Tests
        shell: pwsh
        run: |
          dotnet test ${{ env.TEST_PROJECT }} `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory TestResults `
            --verbosity normal `
            --framework net10.0

  # Security and quality gates
  security:
    name: 🔒 Security & Quality
    runs-on: ubuntu-latest
    needs: [build-bff]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --verbosity minimal

      - name: Security Scan
        run: dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive

      - name: Code Quality Summary
        run: |
          echo "## 🔒 Security & Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build and tests passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ No vulnerable packages detected" >> $GITHUB_STEP_SUMMARY
